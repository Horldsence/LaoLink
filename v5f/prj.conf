# V5F application configuration

CONFIG_GPIO=y
CONFIG_SERIAL=y

# No console on USART8: the Rust application owns the UART and speaks the
# SUMP (logic analyzer) protocol on it. Any kernel log output would corrupt
# the binary stream.
# CONFIG_CONSOLE is not set
# CONFIG_UART_CONSOLE is not set

# Rust application support (zephyr-lang-rust module).
CONFIG_RUST=y
CONFIG_RUST_ALLOC=y

# The Rust main runs on the main thread; give it room for logging.
CONFIG_MAIN_STACK_SIZE=8192
